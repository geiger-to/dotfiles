# Status bar
set-option -g status-justify centre

# Display only the hostname on the left
set-option -g status-left ' #h'
set -g status-right ""

# Display only the name of the window in the status bar
set-option -g window-status-format ' #W '
set-option -g window-status-current-format ' #W '

source-file ~/.tmux/catppuccin/mocha.conf
set-hook -g client-dark-theme { source-file ~/.tmux/catppuccin/mocha.conf }
set-hook -g client-light-theme { source-file ~/.tmux/catppuccin/latte.conf }

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Listen for activity on all windows
set -g bell-action any

# Add mouse support
set -g mouse on
setw -g monitor-activity on

# Bind prefix to C-space, which is similar
# to how the leader key is used in vim.
set -g prefix C-Space

# Easily reload configuration
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Easily move around panes, just like vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Easily create new panes similar to vim
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind S choose-tree -s
bind C-l send-keys C-l

# Disable the ESC key functionality since it causes issues
# with vim and other software that relies on ESC
set -s escape-time 0

# Enable copy-paste with mouse and keyboard
set -g @yank_with_mouse on
setw -g mode-keys vi
set -s set-clipboard on

# Copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Get TPM up and running
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'

# initializes TMUX plugin manager
run-shell ~/.tmux/plugins/tpm/tpm
